<div class="max-w-xl mx-auto bg-zinc-900 border border-zinc-800 rounded-lg p-6">
    <h1 class="text-xl font-bold text-zinc-100 uppercase tracking-wide mb-6">Registar Novo Prazo Inexorável</h1>
  
    <form #formTask="ngForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-mono text-zinc-400 mb-1">Título do Prazo *</label>
        <input 
          type="text" 
          name="titulo" 
          [(ngModel)]="titulo" 
          required 
          placeholder="Ex: Entrega do Trabalho de Angular"
          class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-zinc-100 focus:outline-none focus:border-red-500 text-sm">
      </div>
  
      <div>
        <label class="block text-xs font-mono text-zinc-400 mb-1">Descrição</label>
        <textarea 
          name="descricao" 
          [(ngModel)]="descricao" 
          rows="3"
          placeholder="Detalhes ou requisitos do prazo..."
          class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-zinc-100 focus:outline-none focus:border-red-500 text-sm"></textarea>
      </div>
  
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-mono text-zinc-400 mb-1">Categoria</label>
          <select 
            name="categoria" 
            [(ngModel)]="categoria"
            class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-zinc-100 focus:outline-none focus:border-red-500 text-sm">
            <option value="Acadêmico">Acadêmico</option>
            <option value="Trabalho">Trabalho</option>
            <option value="Pessoal">Pessoal</option>
          </select>
        </div>
  
        <div>
          <label class="block text-xs font-mono text-zinc-400 mb-1">Data e Hora Limite *</label>
          <input 
            type="datetime-local" 
            name="dataLimite" 
            [(ngModel)]="dataLimite" 
            required
            class="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-zinc-100 focus:outline-none focus:border-red-500 text-sm">
        </div>
      </div>
  
      <div class="flex items-center justify-between pt-4 border-t border-zinc-800">
        <a routerLink="/tarefas" class="text-sm text-zinc-400 hover:text-white">Cancelar</a>
        <button 
          type="submit" 
          [disabled]="formTask.invalid"
          class="bg-red-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-red-700 text-white font-medium px-5 py-2 rounded text-sm transition-colors">
          Salvar Prazo
        </button>
      </div>
    </form>
  </div>
